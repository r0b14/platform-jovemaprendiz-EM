<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ajGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#ajGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />

  <!-- Stylized Learning / Cap Top Diamond -->
  <path d="M32 14L50 24L32 34L14 24L32 14Z" fill="#ffffff" filter="url(#shadow)" />

  <!-- Cap Under Base -->
  <path d="M21 28.5V36.5C21 42.5 32 46 32 46C32 46 43 42.5 43 36.5V28.5L32 34.5L21 28.5Z" fill="rgba(255,255,255,0.88)" />

  <!-- Rising Arrow / Growth Spark (Learning Trajectory) -->
  <path d="M32 48L32 28" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M26 33L32 26L38 33" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Golden Graduation Tassel Dot -->
  <circle cx="50" cy="27" r="3" fill="url(#goldGrad)" />
  <path d="M50 27V36" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
